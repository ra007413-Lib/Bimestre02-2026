<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sowl Digital</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
        <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: white;
        }

        .sowl-section {
            padding: 50px 0;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .descricao {
            text-align: center;
            color: #777;
            font-size: 13px;
            max-width: 750px;
            margin: 0 auto 35px;
            line-height: 1.6;
        }

        .icones {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .icones a {
            width: 130px;
            height: 130px;
            border: 2px solid #ccc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icones img {
            width: 105px;
            height: 105px;
            object-fit: contain;
        }

        .imagem-principal {
            width: 100%;
            max-width: 550px;
            height: auto;
            display: block;
            margin: auto;
        }

        /* Ajuste para celulares */
        @media (max-width: 767px) {

            .icones {
                flex-direction: row;
                justify-content: center;
                margin-bottom: 25px;
            }

        }

    </style>

</head>
<body>
    <section class="sowl-section">

        <div class="container">

            <h1>Siga a sOwl e empodere-se</h1>

            <p class="descricao">
                A sOwl digital direciona aqueles que desejam expandir
                o alcance de seus produtos e serviços no mundo digital.
                Desenvolva sua missão, fortaleça sua marca e ganhe
                visibilidade nas redes sociais.
            </p>

            <div class="row align-items-center justify-content-center">
                 <!-- Ícones das redes sociais -->
                <div class="col-12 col-md-2">

                    <div class="icones">

                        <a href="https://www.facebook.com/" target="_blank">
                            <img src="imagens/facebook.jpg" alt="Facebook">
                        </a>

                        <a href="https://www.instagram.com/" target="_blank">
                            <img src="imagens/instagram.jpg" alt="Instagram">
                        </a>

                    </div>

                </div>

                <!-- Imagem principal -->
                <div class="col-12 col-md-8">

                    <img src="imagens/redesSociais.jpg"
                         class="imagem-principal img-fluid"
                         alt="Pessoa utilizando celular">

                </div>

            </div>

        </div>

    </section>

</body>
</html>
</body>
</html>
